name: Weekly Review Cron

on:
  schedule:
    - cron: '0 7 * * 0' # Every Sunday at 07:00 UTC
  workflow_dispatch: {}

jobs:
  run-weekly-review:
    runs-on: ubuntu-latest
    steps:
      - name: POST weekly review
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "APP_URL or ADMIN_TOKEN not set; skipping";
            exit 1;
          fi
          echo "Calling weekly review endpoint on $APP_URL";
          curl -sSf -X POST "$APP_URL/api/cron/weekly-review" -H "x-admin-token: $ADMIN_TOKEN" -H 'Content-Type: application/json' -d '{}' || exit 1
